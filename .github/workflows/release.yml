name: ArturChat release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: New release version to publish (for example v0.4.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build, sign and publish ArturChat
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      FIREBASE_GOOGLE_SERVICES_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_BASE64 }}
      ARTURCHAT_KEYSTORE_BASE64: ${{ secrets.ARTURCHAT_KEYSTORE_BASE64 }}
      ARTURCHAT_KEYSTORE_PASSWORD: ${{ secrets.ARTURCHAT_KEYSTORE_PASSWORD }}
      ARTURCHAT_KEY_ALIAS: ${{ secrets.ARTURCHAT_KEY_ALIAS }}
      ARTURCHAT_KEY_PASSWORD: ${{ secrets.ARTURCHAT_KEY_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Prepare Firebase Android configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_GOOGLE_SERVICES_BASE64:-}" ]; then
            echo "::warning::FIREBASE_GOOGLE_SERVICES_BASE64 is not configured; this APK will not register FCM tokens."
            exit 0
          fi
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_BASE64" | base64 --decode > app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("app/google-services.json").read_text(encoding="utf-8"))
          clients = config.get("client", [])
          package_names = {
              item.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for item in clients
          }
          if "com.facevideo.app" not in package_names:
              raise SystemExit("Firebase config does not contain Android package com.facevideo.app")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Validate signing configuration and prepare keystore
        shell: bash
        run: |
          set -euo pipefail
          for name in ARTURCHAT_KEYSTORE_BASE64 ARTURCHAT_KEYSTORE_PASSWORD ARTURCHAT_KEY_ALIAS ARTURCHAT_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required Actions secret: $name"
              exit 1
            fi
          done
          echo "$ARTURCHAT_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/arturchat-upload.jks"
          chmod 600 "$RUNNER_TEMP/arturchat-upload.jks"
          echo "ARTURCHAT_KEYSTORE_PATH=$RUNNER_TEMP/arturchat-upload.jks" >> "$GITHUB_ENV"

      - name: Read and validate release version
        id: version
        env:
          RELEASE_TAG_INPUT: ${{ github.event.inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          RAW_TAG="${RELEASE_TAG_INPUT}"
          VERSION="${RAW_TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release version must use MAJOR.MINOR.PATCH format, with or without a leading v (for example 0.4.4 or v0.4.4)"
            exit 1
          fi
          TAG="v$VERSION"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Create release tag for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            TAG_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG")"
            HEAD_COMMIT="$(git rev-parse HEAD)"
            if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
              echo "::error::That tag already exists on another commit. Use a new version number."
              exit 1
            fi
          else
            git tag -a "$RELEASE_TAG" -m "ArturChat $RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          fi

      - name: Run unit tests
        run: >-
          gradle --no-daemon testDebugUnitTest
          -PSUPABASE_URL="$SUPABASE_URL"
          -PSUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          -PAPP_VERSION_NAME="${{ steps.version.outputs.name }}"
          -PAPP_VERSION_CODE="${{ steps.version.outputs.code }}"

      - name: Build signed release APK
        run: >-
          gradle --no-daemon assembleRelease
          -PSUPABASE_URL="$SUPABASE_URL"
          -PSUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          -PAPP_VERSION_NAME="${{ steps.version.outputs.name }}"
          -PAPP_VERSION_CODE="${{ steps.version.outputs.code }}"

      - name: Verify signed release APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Prepare release assets and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/ArturChat.apk
          cd release
          sha256sum ArturChat.apk > ArturChat.apk.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ArturChat ${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: |
            release/ArturChat.apk
            release/ArturChat.apk.sha256
