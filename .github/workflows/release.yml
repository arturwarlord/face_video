name: ArturChat release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to build and publish (for example v0.4.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build, sign and publish ArturChat
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      ARTURCHAT_KEYSTORE_BASE64: ${{ secrets.ARTURCHAT_KEYSTORE_BASE64 }}
      ARTURCHAT_KEYSTORE_PASSWORD: ${{ secrets.ARTURCHAT_KEYSTORE_PASSWORD }}
      ARTURCHAT_KEY_ALIAS: ${{ secrets.ARTURCHAT_KEY_ALIAS }}
      ARTURCHAT_KEY_PASSWORD: ${{ secrets.ARTURCHAT_KEY_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Validate signing configuration and prepare keystore
        shell: bash
        run: |
          set -euo pipefail
          for name in ARTURCHAT_KEYSTORE_BASE64 ARTURCHAT_KEYSTORE_PASSWORD ARTURCHAT_KEY_ALIAS ARTURCHAT_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required Actions secret: $name"
              exit 1
            fi
          done
          echo "$ARTURCHAT_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/arturchat-upload.jks"
          chmod 600 "$RUNNER_TEMP/arturchat-upload.jks"
          echo "ARTURCHAT_KEYSTORE_PATH=$RUNNER_TEMP/arturchat-upload.jks" >> "$GITHUB_ENV"

      - name: Read release version from tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must use semantic version format vMAJOR.MINOR.PATCH"
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: >-
          gradle --no-daemon testDebugUnitTest
          -PSUPABASE_URL="$SUPABASE_URL"
          -PSUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          -PAPP_VERSION_NAME="${{ steps.version.outputs.name }}"
          -PAPP_VERSION_CODE="${{ steps.version.outputs.code }}"

      - name: Build signed release APK
        run: >-
          gradle --no-daemon assembleRelease
          -PSUPABASE_URL="$SUPABASE_URL"
          -PSUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          -PAPP_VERSION_NAME="${{ steps.version.outputs.name }}"
          -PAPP_VERSION_CODE="${{ steps.version.outputs.code }}"

      - name: Prepare release assets and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/ArturChat.apk
          cd release
          sha256sum ArturChat.apk > ArturChat.apk.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: ArturChat ${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: |
            release/ArturChat.apk
            release/ArturChat.apk.sha256
