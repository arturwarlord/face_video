name: TURN relay connectivity check

on:
  push:
    paths:
      - ".github/workflows/turn-relay-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-open-relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Diagnose Open Relay DNS
        run: |
          node <<'NODE'
          const dns = require("node:dns").promises;
          const hosts = [
            "staticauth.openrelay.metered.ca",
            "openrelay.metered.ca",
            "relay.metered.ca",
          ];
          (async () => {
            for (const host of hosts) {
              try {
                console.log("system DNS", host, await dns.lookup(host, { all: true }));
              } catch (error) {
                console.log("system DNS", host, error.code, error.message);
              }
              try {
                const response = await fetch(
                  "https://dns.google/resolve?name=" + encodeURIComponent(host) + "&type=A"
                );
                console.log("Google DNS", host, await response.text());
              } catch (error) {
                console.log("Google DNS", host, "ERROR", String(error));
              }
            }
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
      - name: Test Open Relay transports individually
        run: |
          node <<'NODE'
          const { chromium } = require("playwright");
          const { createHmac, randomUUID } = require("node:crypto");

          const host = "staticauth.openrelay.metered.ca";
          const urls = [
            `turn:${host}:80?transport=udp`,
            `turn:${host}:443?transport=udp`,
            `turn:${host}:443?transport=tcp`,
            `turns:${host}:443?transport=tcp`,
          ];

          async function testUrl(browser, url) {
            const expiresAt = Math.floor(Date.now() / 1000) + 6 * 60 * 60;
            const username = `${expiresAt}:arturchat-actions-${randomUUID()}`;
            const credential = createHmac("sha1", "openrelayprojectsecret")
              .update(username)
              .digest("base64");

            const page = await browser.newPage();
            try {
              await page.setContent("<!doctype html><html><body>TURN test</body></html>");
              return await page.evaluate(async ({ url, username, credential }) => {
                return await new Promise(async (resolve) => {
                  const pc = new RTCPeerConnection({
                    iceTransportPolicy: "relay",
                    iceServers: [{ urls: url, username, credential }],
                  });
                  const candidates = [];
                  const errors = [];
                  let finished = false;

                  const finish = (reason) => {
                    if (finished) return;
                    finished = true;
                    clearTimeout(timer);
                    pc.close();
                    resolve({ url, reason, candidates, errors });
                  };

                  const timer = setTimeout(() => finish("timeout"), 12000);
                  pc.onicecandidate = (event) => {
                    if (!event.candidate) return finish("gathering-complete");
                    candidates.push({
                      type: event.candidate.type,
                      protocol: event.candidate.protocol,
                      address: event.candidate.address,
                      port: event.candidate.port,
                    });
                  };
                  pc.onicecandidateerror = (event) => errors.push({
                    code: event.errorCode || null,
                    url: event.url || null,
                    text: event.errorText || null,
                  });

                  try {
                    pc.createDataChannel("probe");
                    await pc.setLocalDescription(await pc.createOffer());
                  } catch (error) {
                    finish("offer-error: " + String(error));
                  }
                });
              }, { url, username, credential });
            } finally {
              await page.close();
            }
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ["--no-sandbox", "--disable-dev-shm-usage"],
            });
            try {
              const results = [];
              for (const url of urls) {
                results.push(await testUrl(browser, url));
              }
              console.log(JSON.stringify({
                relayCandidateFound: results.some((r) =>
                  r.candidates.some((candidate) => candidate.type === "relay")
                ),
                results,
              }, null, 2));
              if (!results.some((r) =>
                r.candidates.some((candidate) => candidate.type === "relay")
              )) process.exitCode = 1;
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
