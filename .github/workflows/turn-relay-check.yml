name: TURN relay connectivity check

on:
  push:
    paths:
      - ".github/workflows/turn-relay-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-open-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test Open Relay static-auth TURN
        run: |
          node <<'NODE'
          const { chromium } = require("playwright");
          const { createHmac, randomUUID } = require("node:crypto");

          (async () => {
            const expiresAt = Math.floor(Date.now() / 1000) + 6 * 60 * 60;
            const username = `${expiresAt}:arturchat-actions-${randomUUID()}`;
            const credential = createHmac("sha1", "openrelayprojectsecret")
              .update(username)
              .digest("base64");

            const host = "staticauth.openrelay.metered.ca";
            const urls = [
              `turn:${host}:80?transport=udp`,
              `turn:${host}:443?transport=udp`,
              `turn:${host}:443?transport=tcp`,
              `turns:${host}:443?transport=tcp`,
            ];
            const iceServers = urls.map((url) => ({
              urls: url,
              username,
              credential,
            }));

            const browser = await chromium.launch({
              headless: true,
              args: ["--no-sandbox", "--disable-dev-shm-usage"],
            });

            try {
              const page = await browser.newPage();
              await page.setContent("<!doctype html><html><body>TURN test</body></html>");
              const result = await page.evaluate(async (servers) => {
                return await new Promise(async (resolve) => {
                  const pc = new RTCPeerConnection({ iceServers: servers });
                  const counts = { host: 0, srflx: 0, relay: 0, other: 0 };
                  const protocols = {};
                  const errors = [];
                  let finished = false;

                  const finish = (reason) => {
                    if (finished) return;
                    finished = true;
                    clearTimeout(timer);
                    pc.close();
                    resolve({ reason, counts, protocols, errors });
                  };

                  const timer = setTimeout(() => finish("timeout"), 25000);

                  pc.onicecandidate = (event) => {
                    if (!event.candidate) {
                      finish("gathering-complete");
                      return;
                    }
                    const type = event.candidate.type || "other";
                    counts[type] = (counts[type] || 0) + 1;
                    const protocol = event.candidate.protocol || "unknown";
                    protocols[type] = protocols[type] || {};
                    protocols[type][protocol] = (protocols[type][protocol] || 0) + 1;
                  };

                  pc.onicecandidateerror = (event) => {
                    errors.push({
                      code: event.errorCode || null,
                      url: event.url || null,
                      text: event.errorText || null,
                    });
                  };

                  try {
                    pc.createDataChannel("probe");
                    const offer = await pc.createOffer();
                    await pc.setLocalDescription(offer);
                  } catch (error) {
                    finish("offer-error: " + String(error));
                  }
                });
              }, iceServers);

              console.log(JSON.stringify({
                relayCandidateFound: result.counts.relay > 0,
                result,
              }, null, 2));

              if (!result.counts.relay) process.exitCode = 1;
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
