name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test APK
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      FIREBASE_GOOGLE_SERVICES_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_BASE64 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Prepare Firebase Android configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_GOOGLE_SERVICES_BASE64:-}" ]; then
            echo "::warning::FIREBASE_GOOGLE_SERVICES_BASE64 is not configured; this APK will not register FCM tokens."
            exit 0
          fi
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_BASE64" | base64 --decode > app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("app/google-services.json").read_text(encoding="utf-8"))
          clients = config.get("client", [])
          package_names = {
              item.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for item in clients
          }
          if "com.facevideo.app" not in package_names:
              raise SystemExit("Firebase config does not contain Android package com.facevideo.app")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run unit tests
        run: >-
          gradle --no-daemon testDebugUnitTest
          -PSUPABASE_URL="$SUPABASE_URL"
          -PSUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Build debug APK
        run: >-
          gradle --no-daemon assembleDebug
          -PSUPABASE_URL="$SUPABASE_URL"
          -PSUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: arturchat-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
