name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test APK
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      FIREBASE_GOOGLE_SERVICES_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_BASE64 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Prepare Firebase Android configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_GOOGLE_SERVICES_BASE64:-}" ]; then
            echo "::error::FIREBASE_GOOGLE_SERVICES_BASE64 is not configured."
            exit 1
          fi
          python3 - <<'PY'
          import base64
          import binascii
          import json
          import os
          import re
          from pathlib import Path

          value = os.environ["FIREBASE_GOOGLE_SERVICES_BASE64"].strip()
          if value.startswith("{"):
              config_text = value
          else:
              compact = re.sub(r"\s+", "", value)
              try:
                  padded = compact + ("=" * (-len(compact) % 4))
                  config_text = base64.b64decode(padded, validate=True).decode("utf-8")
              except (binascii.Error, UnicodeDecodeError) as exc:
                  raise SystemExit(
                      "Firebase secret must contain raw google-services.json or valid Base64 JSON."
                  ) from exc

          config = json.loads(config_text)
          clients = config.get("client", [])
          package_names = {
              item.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for item in clients
          }
          if "com.facevideo.app" not in package_names:
              raise SystemExit("Firebase config does not contain Android package com.facevideo.app")

          Path("app/google-services.json").write_text(config_text + "\n", encoding="utf-8")
          print("Firebase Android configuration validated for com.facevideo.app.")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run unit tests
        run: >-
          gradle --no-daemon testDebugUnitTest
          -PSUPABASE_URL="$SUPABASE_URL"
          -PSUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Build debug APK
        run: >-
          gradle --no-daemon assembleDebug
          -PSUPABASE_URL="$SUPABASE_URL"
          -PSUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: arturchat-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
