name: ArturChat 0.7.50 signed installable APK

# Build a signed test APK for installation over the current app. Never publish a GitHub Release.
on:
  push:
    branches: [main, 'design/arturchat-inbox-v1']
    paths:
      - "app/src/main/**"
      - "app/build.gradle.kts"
      - "gradle/**"
      - ".github/workflows/signed-candidate.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/src/main/**"
      - "app/build.gradle.kts"
      - "gradle/**"
      - ".github/workflows/signed-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-signed-candidate:
    name: Build and sign installable test APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      FIREBASE_GOOGLE_SERVICES_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_BASE64 }}
      ARTURCHAT_KEYSTORE_BASE64: ${{ secrets.ARTURCHAT_KEYSTORE_BASE64 }}
      ARTURCHAT_KEYSTORE_PASSWORD: ${{ secrets.ARTURCHAT_KEYSTORE_PASSWORD }}
      ARTURCHAT_KEY_ALIAS: ${{ secrets.ARTURCHAT_KEY_ALIAS }}
      ARTURCHAT_KEY_PASSWORD: ${{ secrets.ARTURCHAT_KEY_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Prepare Firebase Android configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_GOOGLE_SERVICES_BASE64:-}" ]; then
            echo "::error::FIREBASE_GOOGLE_SERVICES_BASE64 is not configured."
            exit 1
          fi
          python3 - <<'PY'
          import base64
          import binascii
          import json
          import os
          import re
          from pathlib import Path

          value = os.environ["FIREBASE_GOOGLE_SERVICES_BASE64"].strip()
          if value.startswith("{"):
              config_text = value
          else:
              compact = re.sub(r"\s+", "", value)
              try:
                  padded = compact + ("=" * (-len(compact) % 4))
                  config_text = base64.b64decode(padded, validate=True).decode("utf-8")
              except (binascii.Error, UnicodeDecodeError) as exc:
                  raise SystemExit(
                      "Firebase secret must contain raw google-services.json or valid Base64 JSON."
                  ) from exc

          config = json.loads(config_text)
          clients = config.get("client", [])
          package_names = {
              item.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for item in clients
          }
          if "com.facevideo.app" not in package_names:
              raise SystemExit("Firebase config does not contain Android package com.facevideo.app")

          Path("app/google-services.json").write_text(config_text + "\n", encoding="utf-8")
          print("Firebase Android configuration validated for com.facevideo.app.")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Validate signing configuration and prepare existing release keystore
        shell: bash
        run: |
          set -euo pipefail
          for name in ARTURCHAT_KEYSTORE_BASE64 ARTURCHAT_KEYSTORE_PASSWORD ARTURCHAT_KEY_ALIAS ARTURCHAT_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required Actions secret: $name"
              exit 1
            fi
          done
          echo "$ARTURCHAT_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/arturchat-candidate.jks"
          chmod 600 "$RUNNER_TEMP/arturchat-candidate.jks"
          echo "ARTURCHAT_KEYSTORE_PATH=$RUNNER_TEMP/arturchat-candidate.jks" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: >-
          gradle --no-daemon testDebugUnitTest
          -PSUPABASE_URL="$SUPABASE_URL"
          -PSUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          -PAPP_VERSION_NAME="0.7.50"
          -PAPP_VERSION_CODE="7050"

      - name: Build signed installable APK
        run: >-
          gradle --no-daemon assembleRelease
          -PSUPABASE_URL="$SUPABASE_URL"
          -PSUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          -PAPP_VERSION_NAME="0.7.50"
          -PAPP_VERSION_CODE="7050"

      - name: Verify package, version and APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.facevideo.app' versionCode='7050' versionName='0.7.50'"

      - name: Prepare APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p installable
          cp app/build/outputs/apk/release/app-release.apk installable/ArturChat-0.7.50.apk
          cd installable
          sha256sum ArturChat-0.7.50.apk > ArturChat-0.7.50.apk.sha256

      - name: Upload signed installable APK (no GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: arturchat-0.7.50-installable
          path: |
            installable/ArturChat-0.7.50.apk
            installable/ArturChat-0.7.50.apk.sha256
          if-no-files-found: error
          retention-days: 14
