name: ArturChat 0.8.2 signed installable APK

# Build a signed test APK for installation over the current app. Never publish a GitHub Release.
on:
  push:
    branches: [main, 'design/arturchat-inbox-v1']
    paths:
      - "app/src/main/**"
      - "app/build.gradle.kts"
      - "gradle/**"
      - ".github/workflows/signed-candidate.yml"
      - ".github/scripts/**"
  pull_request:
    branches: [main]
    paths:
      - "app/src/main/**"
      - "app/build.gradle.kts"
      - "gradle/**"
      - ".github/workflows/signed-candidate.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-signed-candidate:
    name: Build and sign installable test APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      FIREBASE_GOOGLE_SERVICES_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_BASE64 }}
      ARTURCHAT_KEYSTORE_BASE64: ${{ secrets.ARTURCHAT_KEYSTORE_BASE64 }}
      ARTURCHAT_KEYSTORE_PASSWORD: ${{ secrets.ARTURCHAT_KEYSTORE_PASSWORD }}
      ARTURCHAT_KEY_ALIAS: ${{ secrets.ARTURCHAT_KEY_ALIAS }}
      ARTURCHAT_KEY_PASSWORD: ${{ secrets.ARTURCHAT_KEY_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Validate and prepare required Firebase Android configuration
        run: python3 .github/scripts/prepare_firebase_config.py

      - name: Validate launcher icon resources
        shell: bash
        run: |
          set -euo pipefail
          for icon in ic_launcher.xml ic_launcher_round.xml; do
            resource="app/src/main/res/mipmap-anydpi-v26/$icon"
            test -s "$resource"
            grep -Fq '@mipmap/ic_launcher_artwork' "$resource"
            if grep -Fq '@mipmap/ic_launcher"' "$resource"; then
              echo "::error::Adaptive launcher icon must not reference itself."
              exit 1
            fi
          done
          test -s app/src/main/res/mipmap-nodpi/ic_launcher_artwork.webp
          test -s app/src/main/res/mipmap-nodpi/ic_launcher.webp

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Validate signing configuration and prepare existing release keystore
        shell: bash
        run: |
          set -euo pipefail
          for name in ARTURCHAT_KEYSTORE_BASE64 ARTURCHAT_KEYSTORE_PASSWORD ARTURCHAT_KEY_ALIAS ARTURCHAT_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required Actions secret: $name"
              exit 1
            fi
          done
          echo "$ARTURCHAT_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/arturchat-candidate.jks"
          chmod 600 "$RUNNER_TEMP/arturchat-candidate.jks"
          echo "ARTURCHAT_KEYSTORE_PATH=$RUNNER_TEMP/arturchat-candidate.jks" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: >-
          gradle --no-daemon testDebugUnitTest
          -PSUPABASE_URL="$SUPABASE_URL"
          -PSUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          -PAPP_VERSION_NAME="0.8.2"
          -PAPP_VERSION_CODE="8002"

      - name: Build signed installable APK
        run: >-
          gradle --no-daemon assembleRelease
          -PSUPABASE_URL="$SUPABASE_URL"
          -PSUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          -PAPP_VERSION_NAME="0.8.2"
          -PAPP_VERSION_CODE="8002"

      - name: Verify package, version and APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.facevideo.app' versionCode='8002' versionName='0.8.2'"

      - name: Prepare APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p installable
          cp app/build/outputs/apk/release/app-release.apk installable/ArturChat-0.8.2.apk
          cd installable
          sha256sum ArturChat-0.8.2.apk > ArturChat-0.8.2.apk.sha256

      - name: Upload signed installable APK (no GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: arturchat-0.8.2-installable
          path: |
            installable/ArturChat-0.8.2.apk
            installable/ArturChat-0.8.2.apk.sha256
          if-no-files-found: error
          retention-days: 14
